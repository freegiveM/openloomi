name: Publish npm packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional explicit tag (e.g. v0.8.9). Leave empty to use the ref."
        required: false
        type: string

env:
  NODE_VERSION: "22.14"

jobs:
  build:
    name: Build all packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10.14.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r --filter './packages/**' build --reporter=ndjson
        # Use the workspace filter (recursive) so packages/ai/{mcp,memory-consolidation,rag}
        # are included.

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10.14.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm -r publish handles topological order so workspace deps
      # (e.g. @openloomi/rag -> @openloomi/shared) resolve to the
      # version we just pushed in the same run.
      - name: Publish every package that is private:false
        run: |
          pnpm \
            --no-bail \
            -r \
            --workspace-concurrency=4 \
            --filter './packages/**' \
            publish --no-git-checks --access public --provenance \
            2>&1 | tee /tmp/publish.log
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

      - name: Summarise published packages
        if: always()
        run: |
          echo "Packages attempted this run:"
          grep -E "^(npm notice|[+-] @openloomi)" /tmp/publish.log | sort -u || true

  e2e:
    name: Install from registry and smoke-test
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Tiny consumer: installs @openloomi/shared directly from npm and asserts
      # the exported entrypoint loads without error. If the registry copy is
      # broken or workspace:* leaked in, this fails fast.
      - name: Smoke install @openloomi/shared
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          mkdir -p .e2e && cd .e2e
          cat > package.json <<EOF
          { "name": "openloomi-publish-e2e", "private": true, "type": "module" }
          EOF
          npm install --no-save "@openloomi/shared@${VERSION}"
          node --input-type=module -e "
            import('@openloomi/shared').then((m) => {
              const keys = Object.keys(m).sort();
              if (keys.length === 0) {
                console.error('FAIL: no exports from @openloomi/shared');
                process.exit(1);
              }
              console.log('✓ @openloomi/shared exports:', keys.join(', '));
            }).catch((e) => {
              console.error('FAIL:', e);
              process.exit(1);
            });
          "

      - name: Verify no workspace:* leaked into published manifests
        run: |
          set -euo pipefail
          mkdir -p .e2e/verify && cd .e2e/verify
          for pkg in shared sqlite indexeddb rag hooks storage; do
            if ! npm view "@openloomi/${pkg}" >/dev/null 2>&1; then
              echo "skip $pkg (not on registry)"
              continue
            fi
            MANIFEST=$(npm view "@openloomi/${pkg}" --json | node -e "process.stdin.on('data',b=>{const j=JSON.parse(b);console.log(JSON.stringify({deps:j.dependencies,peer:j.peerDependencies,dev:j.devDependencies},null,2))})")
            if echo "$MANIFEST" | grep -q '"workspace:\*"'; then
              echo "FAIL: workspace:* leaked into @openloomi/${pkg}"
              echo "$MANIFEST"
              exit 1
            fi
            echo "✓ @openloomi/${pkg} manifest clean"
          done
